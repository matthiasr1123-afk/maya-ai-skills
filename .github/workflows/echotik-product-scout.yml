name: EchoTik Product Scout
on:
  schedule:
    - cron: '35 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile scripts/echotik_product_scout.py scripts/echotik_fashion_shortlist.py
      - name: Fetch EchoTik rankings
        env:
          ECHOTIK_USERNAME: ${{ secrets.ECHOTIK_USERNAME }}
          ECHOTIK_PASSWORD: ${{ secrets.ECHOTIK_PASSWORD }}
          ECHOTIK_MAX_PAGES: '5'
        run: python scripts/echotik_product_scout.py
      - name: Build fashion shortlist
        run: python scripts/echotik_fashion_shortlist.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/echotik-product-rankings.json data/maya-echotik-fashion-shortlist.md
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh EchoTik product rankings"
            git push
          fi
