name: EchoTik Product Scout — daily multi-page research
on:
  schedule:
    - cron: '35 16 * * *'
  workflow_dispatch:
    inputs:
      query_json:
        description: 'US daily best-selling products; default query is ready to test'
        required: false
        default: ''
        type: string
permissions:
  contents: write
concurrency:
  group: echotik-product-scout
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python scripts
        run: python -m py_compile scripts/echotik_product_scout.py scripts/echotik_fashion_shortlist.py
      - name: Fetch rankings (up to five HTTP API requests)
        env:
          ECHOTIK_USERNAME: ${{ secrets.ECHOTIK_USERNAME }}
          ECHOTIK_PASSWORD: ${{ secrets.ECHOTIK_PASSWORD }}
          ECHOTIK_MAX_PAGES: "5"
          ECHOTIK_QUERY_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.query_json || '' }}
        run: python scripts/echotik_product_scout.py
      - name: Build fashion shortlist
        run: python scripts/echotik_fashion_shortlist.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/echotik-product-rankings.json data/maya-echotik-fashion-shortlist.md
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh EchoTik product rankings"
            git push
          fi
