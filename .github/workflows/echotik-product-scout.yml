name: EchoTik Product Scout
on:
  schedule:
    - cron: '35 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile scripts/echotik_product_scout.py scripts/echotik_competition_enrich.py scripts/echotik_creator_competition.py scripts/echotik_advanced_signals.py scripts/echotik_research_audit.py scripts/echotik_competing_listings.py scripts/echotik_fashion_shortlist.py
      - name: Fetch EchoTik rankings
        env:
          ECHOTIK_USERNAME: ${{ secrets.ECHOTIK_USERNAME }}
          ECHOTIK_PASSWORD: ${{ secrets.ECHOTIK_PASSWORD }}
          ECHOTIK_MAX_PAGES: '5'
        run: python scripts/echotik_product_scout.py
      - name: Enrich top fashion products with EchoTik detail (one batch request)
        env:
          ECHOTIK_USERNAME: ${{ secrets.ECHOTIK_USERNAME }}
          ECHOTIK_PASSWORD: ${{ secrets.ECHOTIK_PASSWORD }}
        run: python scripts/echotik_competition_enrich.py
      - name: Sample product-associated creators
        env:
          ECHOTIK_USERNAME: ${{ secrets.ECHOTIK_USERNAME }}
          ECHOTIK_PASSWORD: ${{ secrets.ECHOTIK_PASSWORD }}
        run: python scripts/echotik_creator_competition.py
      - name: Gather bounded product trends and associated videos
        env:
          ECHOTIK_USERNAME: ${{ secrets.ECHOTIK_USERNAME }}
          ECHOTIK_PASSWORD: ${{ secrets.ECHOTIK_PASSWORD }}
        run: python scripts/echotik_advanced_signals.py
      - name: Compare overlapping listings in ranking sample
        run: python scripts/echotik_competing_listings.py
      - name: Build fashion shortlist
        run: python scripts/echotik_fashion_shortlist.py
      - name: Audit data quality and coverage
        run: python scripts/echotik_research_audit.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/echotik-product-rankings.json data/maya-echotik-fashion-shortlist.md data/echotik-competition-evidence.json data/echotik-creator-competition.json data/echotik-advanced-signals.json data/maya-product-scout-audit.json data/maya-product-scout-health.md data/echotik-listing-overlap.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh EchoTik product rankings"
            git push
          fi
